<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>働き方は、いま4.0へ｜図解の解説</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap">
<style>
:root{--yellow:#FFD700;--paper:#F1F5F1}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);font-family:'Noto Sans JP',sans-serif}
.wrap{max-width:1160px;margin:24px auto;padding:0 20px}
.fx{position:relative;width:100%;aspect-ratio:16/9;min-height:360px;border-radius:16px;overflow:hidden;background:#0B1A16;box-shadow:0 22px 56px rgba(7,34,30,.26)}
.stagewrap{position:absolute;inset:0;overflow:hidden}
.pan{position:absolute;transform-origin:0 0;transition:transform 1.15s cubic-bezier(.25,.9,.25,1);will-change:transform}
.pan img{display:block;width:100%;height:auto}
.spot{position:absolute;border:solid var(--yellow);border-radius:6px;box-shadow:0 0 0 9999px rgba(4,14,12,.62);transition:left .95s cubic-bezier(.25,.9,.25,1),top .95s cubic-bezier(.25,.9,.25,1),width .95s cubic-bezier(.25,.9,.25,1),height .95s cubic-bezier(.25,.9,.25,1);pointer-events:none}
.cap{position:absolute;left:0;right:0;bottom:44px;text-align:center;padding:0 5%;pointer-events:none}
.cap span{display:inline-block;background:rgba(6,20,17,.86);color:#F7F9F5;font-size:clamp(13px,1.9vw,23px);font-weight:700;line-height:1.5;padding:10px 20px;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.4);word-break:keep-all}
.cap b{color:var(--yellow);font-weight:900}
.ui{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:9px 12px;background:linear-gradient(0deg,rgba(4,14,12,.85),transparent)}
.ui button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.38);color:#fff;border-radius:999px;padding:7px 13px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.ui button:hover{background:rgba(255,255,255,.28)}
.ui button.on{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}
.ui .sp{flex:1}
.ui .tm{font-size:11px;color:rgba(247,249,245,.8);font-variant-numeric:tabular-nums}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--yellow);z-index:4}
.poster{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:6%;background:linear-gradient(180deg,rgba(4,14,12,.55),rgba(4,14,12,.88))}
.poster.off{display:none}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.28;z-index:-1}
.poster p{margin:0;font-size:12px;letter-spacing:.16em;color:rgba(247,249,245,.7)}
.poster h1{margin:0;font-size:clamp(17px,2.6vw,30px);font-weight:900;color:#fff;line-height:1.5;text-shadow:0 3px 20px rgba(0,0,0,.6)}
.poster button{background:var(--yellow);color:#1a1a1a;border:0;border-radius:999px;padding:14px 30px;font-size:15px;font-weight:900;cursor:pointer;font-family:inherit}
.poster button:hover{background:#ffe45c}
.poster small{color:rgba(247,249,245,.6);font-size:11.5px}
@media (max-width:700px){.fx{aspect-ratio:4/3}.cap{bottom:40px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="fx" id="fx">
    <div class="stagewrap">
      <div class="pan" id="pan"><img id="fig" src="fig1.jpg" alt="働き方は、いま4.0へ"><div class="spot" id="spot"></div></div>
    </div>
    <div class="cap" id="cap"></div>
    <div class="ui">
      <button type="button" id="pp">❚❚</button>
      <button type="button" id="rw">↺ 最初から</button>
      <span class="sp"></span>
      <span class="tm" id="tm">0:00</span>
      <button type="button" id="mu" class="on">♪ 音声オン</button>
    </div>
    <div class="bar" id="bar"></div>
    <div class="poster" id="poster">
      <img src="fig1.jpg" alt="">
      <p>図解の解説</p>
      <h1>働き方は、いま4.0へ</h1>
      <button type="button" id="go">▶ 解説を見る</button>
      <small>音声が流れます。右下のボタンで消せます。</small>
    </div>
    <audio id="au" preload="none" src="narr1.m4a"></audio>
  </div>
</div>
<script>
(function(){
 var B=[{"t": 0.0, "d": 18.75, "sub": "横軸は、<b>四つの時代</b>。", "boxes": [{"t": 0, "x": 5, "y": 21.5, "w": 90, "h": 8.5}]}, {"t": 19.45, "d": 14.33, "sub": "① 働く人が<b>提供しているもの</b>", "boxes": [{"t": 0, "x": 5, "y": 29, "w": 90, "h": 8}]}, {"t": 34.48, "d": 15.65, "sub": "② <b>人の確保</b>（雇用形態）", "boxes": [{"t": 0, "x": 5, "y": 36.5, "w": 90, "h": 8.5}]}, {"t": 50.83, "d": 11.85, "sub": "③ <b>管理のしかた</b>", "boxes": [{"t": 0, "x": 5, "y": 44, "w": 90, "h": 8.5}]}, {"t": 63.38, "d": 10.69, "sub": "④ <b>その時代の課題</b>", "boxes": [{"t": 0, "x": 5, "y": 51.5, "w": 90, "h": 9}, {"t": 6.0, "x": 73, "y": 51.5, "w": 22, "h": 9}]}, {"t": 74.77, "d": 16.65, "sub": "働く側は4.0。<b>制度は2.0〜3.0のまま。</b>", "boxes": [{"t": 0, "x": 73, "y": 20.5, "w": 22.5, "h": 40}, {"t": 9.0, "x": 45, "y": 6, "w": 50, "h": 14}]}, {"t": 92.12, "d": 14.43, "sub": "雇う側の<b>3つのズレ</b>", "boxes": [{"t": 0, "x": 4, "y": 61, "w": 91, "h": 9}, {"t": 4.0, "x": 15, "y": 61, "w": 26, "h": 9}, {"t": 7.5, "x": 42, "y": 61, "w": 26, "h": 9}, {"t": 10.5, "x": 68, "y": 61, "w": 27, "h": 9}]}, {"t": 107.25, "d": 21.05, "sub": "ズレを生む、<b>共通する根っこ</b>", "boxes": [{"t": 0, "x": 3, "y": 71, "w": 58, "h": 19}, {"t": 4.5, "x": 14, "y": 72.5, "w": 45, "h": 8}, {"t": 12.0, "x": 14, "y": 80.5, "w": 45, "h": 9}]}, {"t": 129.0, "d": 10.51, "sub": "①＋② ＝ <b>感覚論で人を増やす</b>", "boxes": [{"t": 0, "x": 60, "y": 70.5, "w": 36, "h": 19}, {"t": 6.0, "x": 0, "y": 88.5, "w": 100, "h": 11.5}]}], TOTAL=140.21;
 var fx=document.getElementById('fx'),pan=document.getElementById('pan'),fig=document.getElementById('fig'),
     spot=document.getElementById('spot'),cap=document.getElementById('cap'),bar=document.getElementById('bar'),
     pp=document.getElementById('pp'),rw=document.getElementById('rw'),mu=document.getElementById('mu'),
     tm=document.getElementById('tm'),poster=document.getElementById('poster'),go=document.getElementById('go'),au=document.getElementById('au');
 var t=0,run=false,last=0,raf=null,cur=-1,curBox=-1,sound=true,iw=0,ih=0,started=false;

 function layout(){
   var fw=fx.clientWidth, fh=fx.clientHeight, r=(fig.naturalWidth||2526)/(fig.naturalHeight||1786);
   if(fw/fh > r){ ih=fh; iw=fh*r; } else { iw=fw; ih=fw/r; }
   pan.style.width=iw+'px'; pan.style.height=ih+'px';
   pan.style.left=((fw-iw)/2)+'px'; pan.style.top=((fh-ih)/2)+'px';
 }
 function applyBox(b,anim){
   if(!anim){ pan.style.transition='none'; spot.style.transition='none'; }
   var fw=fx.clientWidth, fh=fx.clientHeight;
   var ox=(fw-iw)/2, oy=(fh-ih)/2;
   var bw=b.w/100*iw, bh=b.h/100*ih, px=(b.x+b.w/2)/100*iw, py=(b.y+b.h/2)/100*ih;
   var S=Math.min(fw*0.88/bw, fh*0.74/bh);
   S=Math.max(1,Math.min(3.4,S));
   var tx=fw/2-ox-S*px, ty=fh/2-oy-S*py;
   // 図の外側が映らないように寄せを制限
   if(S*iw<=fw){ tx=(fw-S*iw)/2-ox; } else { tx=Math.min(-ox, Math.max(fw-ox-S*iw, tx)); }
   if(S*ih<=fh){ ty=(fh-S*ih)/2-oy; } else { ty=Math.min(-oy, Math.max(fh-oy-S*ih, ty)); }
   pan.style.transform='translate('+tx+'px,'+ty+'px) scale('+S+')';
   spot.style.left=b.x+'%'; spot.style.top=b.y+'%'; spot.style.width=b.w+'%'; spot.style.height=b.h+'%';
   spot.style.borderWidth=(3/S)+'px'; spot.style.borderRadius=(6/S)+'px';
   if(!anim){ void pan.offsetWidth; pan.style.transition=''; spot.style.transition=''; }
 }
 function render(x){
   var i=0; for(var k=0;k<B.length;k++){ if(x>=B[k].t) i=k; }
   var b=B[i], st=x-b.t;
   if(i!==cur){ cur=i; curBox=-1; cap.innerHTML='<span>'+b.sub+'</span>'; }
   var bi=0; for(var j=0;j<b.boxes.length;j++){ if(st>=b.boxes[j].t) bi=j; }
   if(bi!==curBox){ curBox=bi; applyBox(b.boxes[bi],true); }
   bar.style.width=Math.min(100,x/TOTAL*100)+'%';
   var s=Math.floor(x); tm.textContent=Math.floor(s/60)+':'+('0'+(s%60)).slice(-2);
 }
 function tick(now){ if(!run) return; t=Math.min(TOTAL,t+(now-last)/1000); last=now; render(t);
   if(sound&&au.src){ var d=Math.abs(au.currentTime-t); if(d>0.4){ try{au.currentTime=t}catch(e){} } }
   if(t<TOTAL) raf=requestAnimationFrame(tick); else { run=false; pp.textContent='▶'; try{au.pause()}catch(e){} } }
 function play(){ if(run||t>=TOTAL) return; run=true; last=performance.now(); raf=requestAnimationFrame(tick); pp.textContent='❚❚';
   if(sound){ if(!au.src) au.src=au.getAttribute('src'); try{au.currentTime=t; au.play().catch(function(){});}catch(e){} } }
 function pause(){ run=false; if(raf)cancelAnimationFrame(raf); raf=null; pp.textContent='▶'; try{au.pause()}catch(e){} }
 function seek(x){ t=Math.max(0,Math.min(TOTAL,x)); cur=-1; curBox=-1; render(t); if(sound&&au.src){try{au.currentTime=t}catch(e){}} }
 window.figSeek=seek;
 go.addEventListener('click',function(){ poster.classList.add('off'); started=true; layout(); seek(0); play(); });
 pp.addEventListener('click',function(){ if(!started){go.click();return;} run?pause():play(); });
 rw.addEventListener('click',function(){ seek(0); if(!run) play(); });
 mu.addEventListener('click',function(){ sound=!sound; mu.classList.toggle('on',sound); mu.textContent=sound?'♪ 音声オン':'♪ 音声オフ';
   if(sound){ if(run){ try{au.currentTime=t; au.play().catch(function(){});}catch(e){} } } else { try{au.pause()}catch(e){} } });
 window.addEventListener('resize',function(){ layout(); if(cur>=0&&curBox>=0) applyBox(B[cur].boxes[curBox],false); });
 document.addEventListener('visibilitychange',function(){ if(document.hidden&&run) pause(); });
 function boot(){ layout(); render(0); }
 if(fig.complete) boot(); else fig.addEventListener('load',boot);
})();
</script>
</body>
</html>
